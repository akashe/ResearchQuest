services:
  neo4j:
    image: neo4j:5-community
    container_name: researchquest-neo4j
    restart: unless-stopped
    # Bolt/browser bound to localhost only — this VM has no public exposure yet.
    # Reach it via an SSH tunnel: ssh -L 7687:localhost:7687 -L 7474:localhost:7474 <user>@<vm-ip>
    # Public exposure (TLS via bolt+s, domain, firewall rules) is a Phase 2 concern,
    # once the Streamlit app actually needs to reach this remotely.
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
      NEO4J_PLUGINS: '["graph-data-science"]'
      # GDS procedures are blocked by default security settings — allowlist them.
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*"
      # Tuned for a 4GB VM (Hetzner CPX22 — the old cheaper 8GB CPX31 is no
      # longer orderable, see terraform/variables.tf). Leaves ~2GB headroom
      # for the OS/Docker daemon. Raise these if you move to a bigger box.
      NEO4J_server_memory_heap_initial__size: "1G"
      NEO4J_server_memory_heap_max__size: "1536M"
      NEO4J_server_memory_pagecache_size: "512M"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
