events {
    worker_connections 1024;
}

# Port 80 is now permanently occupied by this nginx (needed to reverse-proxy
# paperverse.co below), so certbot can no longer use --standalone for
# challenges/renewals — both this VM's nip.io cert and paperverse.co's cert
# use --webroot against /var/www/certbot, served here.
http {
    server {
        listen 80 default_server;
        server_name 167-233-171-28.nip.io paperverse.co www.paperverse.co;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # paperverse.co — a separate compose project on this same VM
    # (../Paperverse). TLS terminates here; decrypted traffic is reverse-
    # proxied to Paperverse's `frontend` container over the `shared-web`
    # Docker network (see docker-compose.prod.yml). frontend's own bundled
    # nginx (Paperverse's nginx/nginx.conf) handles the static-file vs /api
    # split internally, proxying /api/ to its own `backend:8000`.
    server {
        listen 443 ssl;
        server_name paperverse.co www.paperverse.co;

        ssl_certificate     /etc/letsencrypt/live/paperverse.co/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/paperverse.co/privkey.pem;

        location / {
            proxy_pass http://paperverse-frontend-1:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

# Neo4j's bolt protocol is a raw TCP protocol, not HTTP — so TLS termination
# happens here via nginx's stream module (TCP/TLS proxy), not the http module.
# Decrypted traffic is forwarded to the neo4j service over the private
# docker-compose network; neo4j itself never needs to know about TLS.
stream {
    server {
        listen 7687 ssl;

        # Domain is fixed to this VM's nip.io hostname (tied 1:1 to its IP,
        # 167.233.171.28) — update this and re-run certbot if the VM's IP
        # ever changes. Path has a "-0001" suffix: the cert was reissued
        # under --webroot (see comment above) after the original lineage's
        # renewal config got corrupted by a bad manual edit; certbot assigns
        # a new numbered lineage rather than reusing a cert-name whose
        # archive dir it still sees as existing.
        ssl_certificate     /etc/letsencrypt/live/167-233-171-28.nip.io-0001/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/167-233-171-28.nip.io-0001/privkey.pem;

        proxy_pass neo4j:7687;
        proxy_timeout 10m;
        proxy_connect_timeout 5s;
    }
}
