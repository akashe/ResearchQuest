# Phase 2 override — public exposure, layered on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Adds an nginx TCP/TLS proxy in front of Neo4j so bolt is reachable over the
# internet as bolt+s (required for Streamlit Community Cloud, which has no
# fixed egress IPs to allowlist instead). Neo4j itself is never bound to a
# public interface — nginx reaches it over the internal compose network.
#
# Mounts the VM's whole /etc/letsencrypt tree (not just live/<domain>/) at
# the same path inside the container — certbot's live/ dir is a directory of
# symlinks into ../../archive/<domain>/, so mounting only the live subdir
# leaves those symlinks dangling. nginx/bolt-proxy.conf references the exact
# domain path directly. Renewal reload is handled by
# /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh on the VM (runs
# automatically via certbot's systemd timer, no cron needed on Ubuntu).
#
# Also reverse-proxies paperverse.co (443) to Paperverse's own `frontend`
# container over the `shared-web` Docker network — a separate compose project
# on this same VM (../Paperverse). Both certs (this VM's nip.io one and
# paperverse.co's) now renew via --webroot against /var/www/certbot, since
# port 80 is permanently held by this nginx (see nginx/bolt-proxy.conf).

services:
  neo4j:
    # `ports` merges with docker-compose.yml by union, not replace — use
    # !override to actually drop the base file's 7687 host publish instead
    # of ending up with it published twice (!reset clears the field instead
    # of replacing it, which isn't what we want here). bolt is intentionally
    # NOT published to the host — nginx is the only path in from outside.
    # For ad-hoc admin queries on the VM itself:
    #   docker exec -it researchquest-neo4j cypher-shell -u neo4j -p ...
    ports: !override
      - "127.0.0.1:7474:7474"

  nginx:
    image: nginx:1.27-alpine
    container_name: researchquest-bolt-proxy
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "7687:7687"
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/bolt-proxy.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - default
      - shared-web

networks:
  shared-web:
    external: true
